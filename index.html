<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zenith Jeanz</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  body {
    font-family: "Suisse Intl", "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #000;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  a { color: #000; text-decoration: none; }
  button { font: inherit; color: inherit; }

  /* ---------- stage ---------- */
  #viewport { position: fixed; inset: 0; overflow: hidden; background: #fff; }
  #stage {
    position: absolute; left: 50%; bottom: 0;
    width: 1440px; height: 900px;
    transform-origin: bottom center;
    background: #fff; overflow: hidden;
  }

  /* ---------- logo ---------- */
  #logo {
    position: fixed; left: 16px; top: 18px;
    width: 221.2px; height: 44px;
    z-index: 100000; transform-origin: top left; display: block;
  }
  #logo svg { width: 100%; height: 100%; display: block; }

  /* ---------- nav ---------- */
  #nav {
    position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%);
    display: flex; gap: 4px; z-index: 100001;
  }
  .pill {
    position: relative;
    background: rgba(0,0,0,0.05);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    border-radius: 200px; height: 28px;
    display: flex; align-items: center; justify-content: center;
  }
  .pill.icon { width: 28px; padding: 0; border: 0; cursor: pointer; }
  .pill.icon svg { width: 14px; height: 14px; display: block; }
  .pill.icon.on { background: #000; }
  .pill.icon.on svg { stroke: #fff; }
  .badge {
    position: absolute; top: -4px; right: -4px;
    min-width: 14px; height: 14px; padding: 0 4px; border-radius: 7px;
    background: #000; color: #fff; font-size: 9px; font-weight: 600; line-height: 14px;
    text-align: center; display: none;
  }
  .badge.show { display: block; }
  .pill.icon.on .badge { background: #fff; color: #000; box-shadow: 0 0 0 1px #000; }
  .pill.links { width: 600px; padding: 6px 24px; justify-content: space-between; }
  .pill.links a {
    text-transform: uppercase; font-size: 12px; font-weight: 600;
    letter-spacing: 0.2px; line-height: 16px; color: #000;
  }
  .pill.links a.on { text-decoration: underline; text-underline-offset: 3px; }
  .pill.links .search { display: none; flex: 1; align-items: center; gap: 12px; }
  .pill.links.searching a { display: none; }
  .pill.links.searching .search { display: flex; }
  .search input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; padding: 0;
    font: inherit; font-size: 12px; font-weight: 600; letter-spacing: 0.2px;
    text-transform: uppercase; color: #000;
  }
  .search input::placeholder { color: rgba(0,0,0,0.4); }
  .search input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
  .search button {
    border: 0; background: none; padding: 0; cursor: pointer;
    font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.2px;
  }

  /* ---------- models ---------- */
  .model {
    position: absolute; left: 0; top: 0;
    width: 1200px; height: 2980px;
    transform-origin: 0 0; will-change: transform;
    cursor: pointer;
    /* the clips are on pure white: multiply drops the white so only the model
       shows, and models pass in front of each other without a frame */
    mix-blend-mode: multiply;
  }
  .model .inner {
    /* as wide as the clip itself, so a full runway stride is never clipped */
    position: absolute; top: 0; bottom: 0; left: -20%; right: -20%;
    overflow: hidden;
    transition: opacity 0.45s ease;
  }
  .model video, .model img.anim {
    position: absolute; top: 0; left: 50%;
    height: 109.29%; width: auto;
    transform: translate(-50%, -4%); transform-origin: top center;
    pointer-events: none;
  }
  .model .filler { position: absolute; top: 0; bottom: 0; left: 8.3333%; right: 8.3333%; background: #DCE3EA; }
  .model.dim .inner { opacity: 0.7; }
  .model.gone .inner { opacity: 0; }
  .model.gone { pointer-events: none; }
  .model.off { display: none; }
  .model.animating { transition: transform 0.65s cubic-bezier(.65,0,.35,1); }

  /* ---------- detail panels ---------- */
  .panel {
    position: fixed; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column;
    text-transform: uppercase; font-size: 12px; font-weight: 600; color: #000;
    letter-spacing: 0.2px;
    opacity: 0; visibility: hidden;
    transition: opacity 0.5s ease, visibility 0s linear 0.5s;
    z-index: 100002;
  }
  body.detail .panel { opacity: 1; visibility: visible; transition: opacity 0.5s ease 0.15s, visibility 0s; }
  #left { left: 24px; width: 220px; gap: 20px; align-items: flex-start; text-align: left; }
  #left .desc { line-height: 1.45; }
  #right { right: 24px; width: 154px; gap: 12px; align-items: flex-end; text-align: right; }
  .u { text-decoration: underline; text-underline-offset: 2px; cursor: pointer; background: none; border: 0; padding: 0; text-transform: uppercase; font-size: 12px; font-weight: 600; letter-spacing: 0.2px; text-align: inherit; }
  .sizes { display: flex; gap: 15px; }
  .sizes button { border: 0; background: none; padding: 0; cursor: pointer; font-size: 12px; font-weight: 600; }
  .sizes button.on { text-decoration: underline; text-underline-offset: 2px; }
  .sizes button:disabled { color: rgba(0,0,0,0.25); text-decoration: line-through; cursor: default; }
  .price {
    font-family: "Instrument Serif", "Didot", "Bodoni 72", "Times New Roman", Times, serif;
    font-variant-numeric: lining-nums; font-feature-settings: "lnum" 1, "onum" 0;
    font-size: 40px; letter-spacing: -0.8px; line-height: 1; font-weight: 400;
  }
  .btn {
    min-width: 107px; height: 32px; padding: 0 16px; border-radius: 23px; border: 0;
    background: #000; color: #fff; cursor: pointer;
    font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.2px;
  }
  .btn:disabled { background: rgba(0,0,0,0.25); cursor: default; }
  .pieces { display: none; flex-direction: column; gap: 10px; width: 100%; }
  .pieces.open { display: flex; }
  .piece { display: flex; flex-direction: column; gap: 3px; line-height: 1.3; }
  .piece .row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .piece .meta { color: rgba(0,0,0,0.5); }

  /* ---------- cart drawer ---------- */
  #scrim {
    position: fixed; inset: 0; background: rgba(0,0,0,0.15); z-index: 100009;
    opacity: 0; visibility: hidden; transition: opacity 0.3s, visibility 0s linear 0.3s;
  }
  #drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: 380px; max-width: 100%;
    background: #fff; z-index: 100010; display: flex; flex-direction: column;
    transform: translateX(100%); transition: transform 0.35s cubic-bezier(.65,0,.35,1);
    text-transform: uppercase; font-size: 12px; font-weight: 600; letter-spacing: 0.2px;
    box-shadow: -1px 0 0 rgba(0,0,0,0.08);
  }
  body.cart-open #scrim { opacity: 1; visibility: visible; transition: opacity 0.3s; }
  body.cart-open #drawer { transform: none; }
  #drawer header, #drawer footer { padding: 20px 24px; display: flex; }
  #drawer header { justify-content: space-between; align-items: center; }
  #drawer .lines { flex: 1; overflow-y: auto; padding: 0 24px; display: flex; flex-direction: column; gap: 18px; }
  #drawer .empty { color: rgba(0,0,0,0.5); padding-top: 8px; line-height: 1.45; }
  .line { display: flex; flex-direction: column; gap: 6px; padding-bottom: 18px; border-bottom: 1px solid rgba(0,0,0,0.08); line-height: 1.3; }
  .line .row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .line .meta { color: rgba(0,0,0,0.5); }
  .qty { display: flex; gap: 12px; align-items: center; }
  .qty button { border: 0; background: rgba(0,0,0,0.05); width: 22px; height: 22px; border-radius: 11px; cursor: pointer; font-weight: 600; padding: 0; }
  #drawer footer { flex-direction: column; gap: 12px; border-top: 1px solid rgba(0,0,0,0.08); }
  #drawer footer .row { display: flex; justify-content: space-between; align-items: baseline; }
  #drawer footer .price { font-size: 32px; }
  #drawer footer .btn { width: 100%; height: 40px; }
  #drawer footer .note { color: rgba(0,0,0,0.5); font-size: 10px; line-height: 1.4; text-transform: none; font-weight: 500; }

  /* ---------- toast ---------- */
  #toast {
    position: fixed; left: 50%; bottom: 76px; transform: translate(-50%, 8px);
    background: #000; color: #fff; border-radius: 200px; padding: 8px 16px;
    font-size: 12px; font-weight: 600; letter-spacing: 0.2px; text-transform: uppercase;
    z-index: 100020; opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s;
    max-width: calc(100vw - 32px); text-align: center;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  body.cart-open #toast { bottom: auto; top: 16px; }

  /* narrow screens: panels move above / below the centred model */
  @media (max-width: 759px) {
    .panel { top: auto; transform: none; }
    #left {
      top: 76px; left: 16px; right: 16px; width: auto; gap: 8px;
      max-height: 45vh; overflow-y: auto;
    }
    #left .desc { display: none; }
    #left.expanded { background: rgba(255,255,255,0.94); padding-bottom: 8px; }
    #right {
      left: 16px; right: 16px; width: auto;
      flex-direction: row; flex-wrap: wrap; align-items: center;
      justify-content: space-between; gap: 10px 12px;
    }
    #right { bottom: 104px; }
    #right .price { font-size: 32px; }
    #nav { flex-wrap: wrap; justify-content: center; row-gap: 6px; }
    .pill.links { order: 2; width: 100%; padding: 6px 14px; }
    body:not(.cart-open) #toast { bottom: 112px; }
  }
</style>
</head>

      e.className = "empty";
      e.textContent = "Your cart is empty. Tap a look on the runway to shop it.";
      box.appendChild(e);
    }
    var total = 0;
    cart.forEach(function (l, idx) {
      var p = pieceByHandle[l.handle];
      total += p.price * l.qty;
      var row = document.createElement("div");
      row.className = "line";
      row.innerHTML =
        '<div class="row"><span class="n"></span><span class="pr"></span></div>' +
        '<div class="meta"></div>' +
        '<div class="row"><span class="qty"><button type="button" aria-label="Decrease">−</button><span class="q"></span><button type="button" aria-label="Increase">+</button></span>' +
        '<button class="u" type="button">remove</button></div>';
      row.querySelector(".n").textContent = p.name;
      row.querySelector(".pr").textContent = money(p.price * l.qty);
      row.querySelector(".meta").textContent = "Size " + l.size + " · " + p.look.name;
      row.querySelector(".q").textContent = l.qty;
      var b = row.querySelectorAll(".qty button");
      b[0].addEventListener("click", function () { l.qty -= 1; if (l.qty < 1) cart.splice(idx, 1); save("zj.cart", cart); renderCart(); });
      b[1].addEventListener("click", function () { l.qty += 1; save("zj.cart", cart); renderCart(); });
      row.querySelector(".u").addEventListener("click", function () { cart.splice(idx, 1); save("zj.cart", cart); renderCart(); });
      box.appendChild(row);
    });
    $("subtotal").textContent = money(total);
    $("checkout").disabled = !cart.length;
    $("cartNote").textContent = CONNECTED
      ? "Shipping and taxes are calculated at checkout."
      : "Demo mode: checkout opens once the Shopify store is connected.";
  }
  function openCart() {
    document.body.classList.add("cart-open");
    $("drawer").setAttribute("aria-hidden", "false");
  }
  function closeCart() {
    document.body.classList.remove("cart-open");
    $("drawer").setAttribute("aria-hidden", "true");
  }
  $("btnCart").addEventListener("click", openCart);
  $("cartClose").addEventListener("click", closeCart);
  $("scrim").addEventListener("click", closeCart);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeCart(); });

  $("checkout").addEventListener("click", function () {
    if (!CONNECTED) { toast("Checkout isn't connected yet — demo mode"); return; }
    var lines = [], missing = [];
    cart.forEach(function (l) {
      var v = variants[l.handle] && variants[l.handle][l.size];
      if (v) lines.push({ merchandiseId: v.id, quantity: l.qty });
      else missing.push(pieceByHandle[l.handle].name + " (" + l.size + ")");
    });
    if (missing.length) { toast("Unavailable: " + missing[0]); return; }
    var btn = $("checkout");
    btn.disabled = true; btn.textContent = "opening checkout…";
    gql("mutation($lines: [CartLineInput!]) { cartCreate(input: { lines: $lines }) { cart { checkoutUrl } userErrors { message } } }", { lines: lines })
      .then(function (d) {
        var res = d.cartCreate;
        if (res.userErrors.length) throw new Error(res.userErrors[0].message);
        location.href = res.cart.checkoutUrl;
      })
      .catch(function (e) {
        toast("Checkout failed: " + e.message);
        btn.disabled = false; btn.textContent = "checkout";
      });
  });

  $("btnAccount").addEventListener("click", function () {
    if (CONNECTED) location.href = "https://" + STORE.shopDomain + "/account";
    else toast("Accounts open once the Shopify store is connected");
  });

  /* ---------- detail view ---------- */
  var narrow = function () { return innerWidth < 760; };
  var size = DATA.defaultSize;

  function detailTransform(el) {
    var cs = coverScale, vw = innerWidth, vh = innerHeight;
    var s, centreY;
    if (narrow()) {
      // room for the name above and the price row below
      var top = 130, bottom = 190;
      var avail = Math.max(vh - top - bottom, vh * 0.45);
      s = avail / (NAT_H * cs);
      centreY = top + avail / 2;
    } else {
      s = (vh * 0.9) / (NAT_H * cs);
      var maxBoxW = vw - 2 * 300;
      if (NAT_W * s * cs > maxBoxW) s = maxBoxW / (NAT_W * cs);
      centreY = vh / 2;
    }
    var mcy = 900 - (vh - centreY) / cs;   // stage-y that maps to centreY
    var x = 720 - (NAT_W * s) / 2;
    var y = mcy - (NAT_H * s) / 2;
    el.style.transform = "translate3d(" + x + "px," + y + "px,0) scale(" + s + ")";
  }

  function fillPanels(look) {
    leftP.querySelector(".name").textContent = look.name;
    leftP.querySelector(".desc").textContent = look.description;
    $("lookPrice").textContent = money(lookPrice(look));

    var sz = $("sizes");
    sz.innerHTML = "";
    DATA.sizes.forEach(function (s) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = s;
      var ok = look.pieces.some(function (p) { return pieceAvailable(p, s); });
      b.disabled = !ok;
      if (s === size) b.className = "on";
      b.addEventListener("click", function () { size = s; fillPanels(look); });
      sz.appendChild(b);
    });
    var lookOk = look.pieces.every(function (p) { return pieceAvailable(p, size); });
    $("addLook").disabled = !lookOk;
    $("addLook").textContent = lookOk ? "add to cart" : "sold out";

    var box = $("pieces");
    box.innerHTML = "";
    look.pieces.forEach(function (p) {
      var d = document.createElement("div");
      d.className = "piece";
      d.innerHTML = '<div class="row"><span class="n"></span><span class="pr"></span></div>' +
        '<div class="row"><span class="meta"></span><button class="u" type="button"></button></div>';
      d.querySelector(".n").textContent = p.name;
      d.querySelector(".pr").textContent = money(p.price);
      d.querySelector(".meta").textContent = p.type + " · size " + size;
      var add = d.querySelector(".u");
      var ok = pieceAvailable(p, size);
      add.textContent = ok ? "add piece" : "sold out";
      add.disabled = !ok;
      add.addEventListener("click", function () { addToCart([p], size); });
      box.appendChild(d);
    });
    renderWish();
  }

  $("addLook").addEventListener("click", function () { if (selected) addToCart(selected.look.pieces, size); });
  $("moreBtn").addEventListener("click", function () {
    var open = $("pieces").classList.toggle("open");
    leftP.classList.toggle("expanded", open);
    $("moreBtn").textContent = open ? "less details" : "more details";
  });

  var closeTimer = null;
  function open(m) {
    if (selected || switching) return;
    clearTimeout(closeTimer);
    selected = m;
    hovered = null;
    paused = true;
    size = DATA.defaultSize;
    $("pieces").classList.remove("open");
    leftP.classList.remove("expanded");
    $("moreBtn").textContent = "more details";
    fillPanels(m.look);
    models.forEach(function (o) {
      o.el.classList.remove("dim");
      if (o !== m) o.el.classList.add("gone");
    });
    playAll();
    m.el.style.zIndex = "50000";
    m.el.classList.add("animating");
    void m.el.offsetWidth;
    detailTransform(m.el);
    document.body.classList.add("detail");
    history.pushState({ zjDetail: m.index }, "");
  }

  function close() {
    if (!selected) return;
    var m = selected;
    document.body.classList.remove("detail");
    models.forEach(function (o) { o.el.classList.remove("gone"); });
    // glide back to the exact runway slot it left
    place(m.el, slotQ(m));
    m.el.style.zIndex = "50000";
    closeTimer = setTimeout(function () {
      m.el.classList.remove("animating");
      selected = null;
      placeAll();
      place(m.el, slotQ(m));
      paused = reduce ? true : false;
      lastTime = null;
      playAll();
      if (pendingAction) { var a = pendingAction; pendingAction = null; a(); }
    }, 660);
  }

  models.forEach(function (m) {
    m.el.addEventListener("click", function () { open(m); });
  });
  window.addEventListener("popstate", function () { close(); });

  // the clipped containers must never scroll (e.g. focus moving to an off-screen model)
  [$("viewport"), stage].forEach(function (c) {
    c.addEventListener("scroll", function () { c.scrollLeft = 0; c.scrollTop = 0; });
  });

  /* ---------- resize ---------- */
  window.addEventListener("resize", function () {
    layout();
    if (selected) {
      selected.el.classList.remove("animating");
      detailTransform(selected.el);
      void selected.el.offsetWidth;
      selected.el.classList.add("animating");
    }
    if (paused || reduce) placeAll();
  });

  renderWish();
  renderCart();
  if (CONNECTED) loadVariants();
  playAll();
})();
</script>
</body>
</html>
